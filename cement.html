<script>
// GitHub 版：透過 Apps Script API 存取雲端（需要通行碼）
const API_URL="https://script.google.com/macros/s/AKfycbx5cAMgG2cXKMPVJzmnYvmyL26-gp99ky4xd-3Nwue9VUQqlzooBdE3eInM-9mk3R8WMw/exec";
const KEY_LS="pile-api-key";
function apiKey_(){let k="";try{k=localStorage.getItem(KEY_LS)||""}catch(e){}
  if(!k){k=(prompt("請輸入通行碼（這台裝置第一次使用時需要）")||"").trim();if(k){try{localStorage.setItem(KEY_LS,k)}catch(e){}}}
  return k}
function resetKey(){try{localStorage.removeItem(KEY_LS)}catch(e){}location.reload()}
async function apiCall(fn,...args){
  const key=apiKey_();if(!key)throw new Error("未輸入通行碼");
  let r;try{r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args,key})})}
  catch(e){throw new Error("無法連到雲端，請檢查網路")}
  let j;try{j=await r.json()}catch(e){throw new Error("雲端回應格式錯誤")}
  if(!j.ok){if(/通行碼/.test(j.error||"")){try{localStorage.removeItem(KEY_LS)}catch(e){}}throw new Error(j.error||"雲端操作失敗")}
  return j.data}
function cloudFetch(url, options){
  const isPost=options && String(options.method||'GET').toUpperCase()==='POST';
  let p;
  if(isPost){let payload;try{payload=JSON.parse(options.body)}catch(e){return Promise.reject(e)}p=apiCall('apiPost',payload)}
  else p=apiCall('apiGet',String(url).includes('what=days')?'days':'state');
  return p.then(data=>({ok:true,json:async()=>data}));
}
</script>
<script>
const $=s=>document.querySelector(s);
const BR=['A1','A2','B1','B2'],NM={A1:'A1 藍款',A2:'A2 橘款',B1:'B1 優泥',B2:'B2 櫻王'};
const VEN=[['wj','五金行'],['ps','專興'],['jc','建材行']],TEAMS=['49招','19文','38高'];
const K=['wj_v','wj_n','ps_v','ps_n','jc_v','jc_n'];
const ST={ok:'庫存安全',low:'⚠ 需叫貨・告急',neg:'庫存負數，請核對',none:'尚無近7天耗用',off:'停用｜不警戒'};
const TABS=[['rec','今日記錄'],['ovw','庫存總覽'],['stat','進料統計'],['list','明細'],['set','設定']];
let S={base:{A1:197,A2:14,B1:173,B2:0},baseDate:'2026-10-31',price:{wj:{v:320,n:320},ps:{v:239,n:246},jc:{v:400,n:400}},std:{v:4.5,n:1.5},wage:2700,stage:1,gas:'https://script.google.com/macros/s/AKfycbzE6lblnHTrYXdRrnlYcNJ7gYPXjTW9oaBusMCaqs5dBJy9ce70Z4NsWh11_F8SVZiN/exec'};
let D={},db=null,tab='rec',cur=iso(new Date()),loaded=false,from='',to='',pmf='all',ipf='all',arm=false,editI='',armI='';let PD={};const TC={'49招':'#c2571a','19文':'#2563a8','38高':'#7a3fa0'};
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n},f1=n=>Math.round(n*10)/10;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shift(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)}
const wd=s=>'日一二三四五六'[new Date(s+'T00:00:00').getDay()];
const md=s=>+s.slice(5,7)+'/'+ +s.slice(8)+'（'+wd(s)+'）';
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1800)}
function bin(x){const i=x.in||{};return{A1:num(i.ps_v),A2:num(i.wj_v),B1:num(i.wj_n)+num(i.ps_n),B2:num(i.jc_n)}}
function lnd(x){const r={A1:0,A2:0,B1:0,B2:0};(x.ln||[]).forEach(l=>{if(r[l.b]!=null)r[l.b]+=(l.k==='ret'?1:-1)*num(l.n)});return r}
function calc(){
  const st={};BR.forEach(b=>st[b]=num(S.base[b]));let last=null;
  Object.keys(D).sort().forEach(d=>{if(d<=S.baseDate)return;const x=D[d],bi=bin(x),lo=lnd(x);
    const u=U(x);BR.forEach(b=>st[b]+=bi[b]-u[b]+lo[b]);if(u.A1>0||u.A2>0||u.B1>0||u.B2>0)last=d});
  const o={},GR={A1:['A1','A2'],A2:['A1','A2'],B1:['B1','B2'],B2:['B1','B2']};
  BR.forEach(b=>{const r={stock:st[b],act:!!GR[b],grp:GR[b]&&GR[b].length>1};
    if(r.act){let sum=0;const gs=GR[b].reduce((a,k)=>a+st[k],0);if(last){const from=shift(last,-6);Object.keys(D).forEach(d=>{if(d>=from&&d<=last&&d>S.baseDate){const u=U(D[d]);GR[b].forEach(k=>sum+=u[k])}})}
      r.gs=gs;r.thr=sum;r.avg=sum/7;r.left=r.avg?gs/r.avg:null;r.sug=Math.ceil(Math.max(0,sum-gs));
      r.s=st[b]<0?'neg':sum===0?'none':gs<sum?'low':'ok'}else r.s='off';
    o[b]=r});
  o.last=last;return o}
const GL=b=>b[0]==='A'?'A1＋A2':'B1＋B2';
function strip(){const c=calc();
  $('#strip').innerHTML=BR.map(b=>`<div class="sc ${c[b].s}"><span class="mut">${NM[b]}</span><br><b>${f1(c[b].stock)}</b> 包 <span class="mut ${c[b].s}">${ST[c[b].s]}</span></div>`).join('')}
function tabs(){$('#tabs').innerHTML=TABS.map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';arm=false;editI='';armI='';view()">${n}</button>`).join('')}
function go(n){cur=shift(cur,n);arm=false;view()}
function G(x){if(x.g)return x.g;const t=(x.t&&x.t[0])||TEAMS[0];return{[t]:{w:num(x.w),cv:num(x.cnt?.v),cn:num(x.cnt?.n),A1:num(x.use?.A1),A2:num(x.use?.A2),B1:num(x.use?.B1),B2:num(x.use?.B2)}}}
function V(o){const z={m1:0,m2:0,nf:false};
  if('c1' in o||'c2' in o)return{c1:num(o.c1),a11:num(o.a11),a21:num(o.a21),c2:num(o.c2),a12:num(o.a12),a22:num(o.a22),p1:num(o.p1),m1:num(o.m1),m2:num(o.m2),nf:'m1' in o};
  if('rd' in o)return num(o.rd)===2?{...z,c1:0,a11:0,a21:0,c2:num(o.cv),a12:num(o.A1_2),a22:num(o.A2_2),p1:num(o.p1)}:{...z,c1:num(o.cv),a11:num(o.A1_1),a21:num(o.A2_1),c2:0,a12:0,a22:0,p1:0};
  if('A1_1' in o||'A1_2' in o||'A2_1' in o||'A2_2' in o){const dn=num(o.A1_2)+num(o.A2_2)>0;return dn?{...z,c1:0,a11:num(o.A1_1),a21:num(o.A2_1),c2:num(o.cv),a12:num(o.A1_2),a22:num(o.A2_2),p1:num(o.A1_1)+num(o.A2_1)}:{...z,c1:num(o.cv),a11:num(o.A1_1),a21:num(o.A2_1),c2:0,a12:0,a22:0,p1:0}}
  return{...z,c1:0,a11:0,a21:0,c2:num(o.cv),a12:num(o.A1),a22:num(o.A2),p1:0}}
function N(o){const v=V(o),dn=v.c2>0||v.a12+v.a22>0;return{w:num(o.w),cv:v.c2,pc:v.c1,cn:num(o.cn)+(v.nf?v.c2:0),A1:v.a11+v.a12,A2:v.a21+v.a22,B1:num(o.B1)+v.m1,B2:num(o.B2)+v.m2,vu:dn?v.a12+v.a22+v.p1:0}}
function U(x){const r={w:0,cv:0,pc:0,cn:0,A1:0,A2:0,B1:0,B2:0,vu:0};Object.values(G(x)).forEach(q=>{const n=N(q);for(const k in r)r[k]+=n[k]});return r}
function pmList(c0){const z=new Set(['']),d=new Date();for(let k=-1;k<=8;k++)z.add(iso(new Date(d.getFullYear(),d.getMonth()+k,1)).slice(0,7));if(c0)z.add(c0);return[...z].sort()}
const pmL=m=>m?m.replace('-','年')+'月':'未計價';
function parseP(t){const r=new Set();String(t||'').split(/[.,，、;；\s]+/).forEach(x=>{x=x.replace(/^[Pp]/,'');let m=x.match(/^(\d+)[-~－～](\d+)$/);if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];if(b-a<=300)for(let k=a;k<=b;k++)r.add(k)}else if(/^\d+$/.test(x))r.add(+x)});return[...r].sort((a,b)=>a-b)}
const fmtP=a=>{const r=[];let i=0;while(i<a.length){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;r.push(j>i?a[i]+'~'+a[j]:String(a[i]));i=j+1}return r.join('.')};
function lastP(t,d){let m=0;Object.keys(D).filter(k=>k<d).forEach(k=>{const o=D[k].g?.[t];if(!o)return;[...parseP(o.gp),...parseP(o.q1)].forEach(x=>{if(x>m)m=x})});return m}
function autoGP(k){const t=TEAMS[k],p='t'+k,g=$('#'+p+'gp'),n=Math.floor(num($('#'+p+'cn').value)),L=lastP(t,cur),sp=$('#'+p+'gpv');
  if(g&&(g.dataset.auto==='1'||!g.value.trim())){
    if(n>0&&n<=300&&L>0){const a=[];for(let i=1;i<=n;i++)a.push(L+i);g.value=fmtP(a);g.dataset.auto='1';if(sp)sp.textContent='自動帶入 共 '+n+' 支：'+fmtP(a)+'（可直接修改）'}
    else{g.value='';g.dataset.auto='';if(sp)sp.textContent=''}}
  hint()}
function pf(id,cid){delete $('#'+id).dataset.auto;const a=parseP($('#'+id).value),c=$('#'+cid);if(a.length&&c)c.value=a.length;const v=$('#'+id+'v');if(v)v.textContent=a.length?'共 '+a.length+' 支：'+fmtP(a):'';hint()}
function pend(t,d){let n=0,a=0,pl=[];Object.keys(D).filter(k=>k<d).sort().forEach(k=>{const o=D[k].g?.[t];if(!o)return;const v=V(o),d2=parseP(o.q2),d1=parseP(o.q1);n=Math.max(0,n-v.c2)+v.c1;a=Math.max(0,a-v.p1)+v.a11+v.a21;pl=pl.filter(x=>!d2.includes(x));d1.forEach(x=>{if(!pl.includes(x))pl.push(x)})});pl.sort((x,y)=>x-y);return{n:Math.max(n,pl.length),a:f1(a),pl:fmtP(pl)}}
function sug(k){const e=$('#t'+k+'c2');if(e){e.value=PD[k]?.n||'';const q=$('#t'+k+'q2');if(q&&PD[k]?.pl){q.value=PD[k].pl;const v=$('#t'+k+'q2v');if(v)v.textContent='共 '+parseP(PD[k].pl).length+' 支：'+fmtP(parseP(PD[k].pl))}hint()}}
function lnRow(l){l=l||{k:'out',b:'B1',n:'',who:''};const o=(v,t,c)=>`<option value="${v}" ${c===v?'selected':''}>${t}</option>`;
  return `<div class="row lnr" style="margin-bottom:6px"><select class="lk" style="width:auto">${o('out','借出',l.k)}${o('ret','歸還',l.k)}</select><select class="lb" style="width:auto">${BR.map(b=>o(b,NM[b],l.b)).join('')}</select><input class="ln" type="number" inputmode="decimal" min="0" step="any" placeholder="包數" value="${num(l.n)||''}" style="width:90px;flex:0 0 90px"><input class="lw" placeholder="經手人-單位（例：高德-FDA）" value="${esc(l.who)}" style="flex:1;width:auto"><button type="button" class="ghost" onclick="this.parentNode.remove()">✕</button></div>`}
function addLn(){$('#lnb').insertAdjacentHTML('beforeend',lnRow())}
function rec(){const x=D[cur]||{},i=x.in||{},g=G(x),v=n=>n?n:'';
  const inp=(id,val,ph)=>`<input id="${id}" type="number" inputmode="decimal" min="0" step="any" value="${v(val)}" ${ph?`placeholder="${ph}"`:''} oninput="hint()">`;
  const pin=(id,val,cid)=>{const a=parseP(val);return `<label>樁號（例：10.12.13.15 或 10-13）<input id="${id}" type="text" inputmode="decimal" autocomplete="off" value="${esc(val||'')}" placeholder="10.12.13.15" oninput="pf('${id}','${cid}')"><span class="mut" id="${id}v">${a.length?'共 '+a.length+' 支：'+fmtP(a):''}</span></label>`};
  const team=(t,k)=>{const o=g[t]||{},a=V(o),p='t'+k,pd=pend(t,cur);PD[k]=pd;
    const p1=a.p1||'',sg=num(o.cn)>0||num(o.B1)+num(o.B2)>0,s1=a.c1>0||a.a11+a.a21>0,s2=a.c2>0||a.m1+a.m2>0;
    return `<div class="team" style="--tc:${TC[t]}"><div class="th">${t}</div>
    <div class="grid"><label>移工人數（工）${inp(p+'w',o.w)}</label></div>
    <div class="sb2">一般組模・不垂流（直接補完，算支數）</div>
    <div class="grid">${pin(p+'gp',o.gp,p+'cn')}<label>支數（輸入後自動帶入樁號）<input id="${p}cn" type="number" inputmode="numeric" min="0" step="1" value="${v(o.cn)}" oninput="autoGP(${k})"><span class="mut">${lastP(t,cur)?'上次做到 P'+lastP(t,cur)+'，下一支 P'+(lastP(t,cur)+1):'尚無先前樁號'}</span></label></div>
    <div id="vg${k}" ${sg?'':'hidden'}><div class="grid" style="margin-top:8px"><label>B1優泥${inp(p+'B1',o.B1)}</label><label>B2櫻王${inp(p+'B2',o.B2)}</label></div></div>
    <div class="sb2">組模1・垂流（第一次補，先不計支數）</div>
    <div class="grid">${pin(p+'q1',o.q1,p+'c1')}<label>新補支數${inp(p+'c1',a.c1)}</label></div>
    <div id="v1${k}" ${s1?'':'hidden'}><div class="grid" style="margin-top:8px"><label>A1藍款${inp(p+'x1',a.a11)}</label><label>A2橘款${inp(p+'y1',a.a21)}</label></div></div>
    <div class="sb2">組模2・不垂流（第二次補，完成才計支數）</div>

  <h3>借還明細（點一下可到當天修改）</h3><table><tr><th>日期</th><th>類型</th><th>品牌</th><th>包數</th><th>經手人-單位</th></tr>${rs.reverse().map(([d,l])=>`<tr class="cl" onclick="cur='${d}';tab='rec';view()"><td>${md(d)}</td><td>${l.k==='ret'?'歸還':'借出'}</td><td>${NM[l.b]||l.b}</td><td>${l.n}</td><td>${esc(l.who||'')}</td></tr>`).join('')}</table></div>`}
async function rmDay(d){const o=D[d];if(!(await gpost({action:'day',date:d,doc:null})))throw new Error('cloud');const check=await pullCloud();if(!check||Object.prototype.hasOwnProperty.call(check.days,d)){throw new Error('雲端刪除驗證失敗，請勿重複操作');}delete D[d]}

function list(){const ds=sel().sort().reverse(),amt=w=>w?(num(w)*S.wage).toLocaleString():'',cm=iso(new Date()).slice(0,7);
  const pms=[...new Set(Object.values(D).map(x=>x.pm).filter(Boolean))].sort();
  const head=`<div class="card">${rng()}<div class="row" style="margin-top:10px"><span class="mut">計價月份</span><select style="width:auto" onchange="pmf=this.value;view()"><option value="all">全部</option><option value="none" ${pmf==='none'?'selected':''}>未計價</option>${pms.map(m=>`<option value="${m}" ${pmf===m?'selected':''}>${pmL(m)}</option>`).join('')}</select>
  <span class="mut">1工＝$${S.wage.toLocaleString()}</span><span style="flex:1"></span><span class="mut">將下表所有日期標記為</span><select id="bm" style="width:auto">${pmList('').slice(1).map(m=>`<option value="${m}" ${m===cm?'selected':''}>${pmL(m)}計價完畢</option>`).join('')}<option value="">未計價（清除標記）</option></select><button onclick="bulk()">套用</button></div></div>`;
  if(!ds.length)return head+'<div class="card mut">這個條件下沒有記錄。</div>';
  const Z=()=>({w:0,cv:0,pc:0,cn:0,A1:0,A2:0,B1:0,B2:0,vu:0}),T=Z(),TT={};
  const pileTxt=g=>Object.entries(g).map(([n,o])=>{const a=[];if(o.gp)a.push('一般 '+fmtP(parseP(o.gp)));if(o.q1)a.push('組模1 '+fmtP(parseP(o.q1)));if(o.q2)a.push('組模2 '+fmtP(parseP(o.q2)));return a.length?(Object.keys(g).length>1?n+'：':'')+a.join('｜'):''}).filter(Boolean).join('；');
  const ptd=t=>`<td style="text-align:left;white-space:normal;min-width:150px">${esc(t)}</td>`;
  const cells=o=>`<td>${o.w||''}</td><td>${amt(o.w)}</td><td class="vl">${o.cv||''}${o.pc?`<span class="mut">（待${o.pc}）</span>`:''}</td><td>${o.A1||''}</td><td>${o.A2||''}</td><td class="vl">${o.cn||''}</td><td>${o.B1||''}</td><td>${o.B2||''}</td>`;
  const dif=o=>(o.cv||o.cn||o.vu||o.B1||o.B2)?`垂${f1(o.vu-o.cv*S.std.v)}／不${f1(o.B1+o.B2-o.cn*S.std.n)}`:'';
  const rows=ds.map(d=>{const x=D[d],g=G(x),u=U(x),names=Object.keys(g),gn={},oc=`onclick="cur='${d}';tab='rec';view()"`;
    names.forEach(n=>gn[n]=N(g[n]));for(const k in T)T[k]+=u[k];
    names.forEach(n=>{TT[n]=TT[n]||Z();for(const k in TT[n])TT[n][k]+=gn[n][k]});
    let h=`<tr class="cl" ${oc}><td>${md(d)}</td><td>${esc(names.join(' '))}</td>${cells(u)}<td class="vl">${dif(u)}</td>${ptd(pileTxt(g))}<td>${pmL(x.pm)}</td></tr>`;
    if(names.length>1)h+=names.map(n=>`<tr class="sub cl" ${oc}><td></td><td>└ ${esc(n)}</td>${cells(gn[n])}<td class="vl">${dif(gn[n])}</td><td></td><td></td></tr>`).join('');
    return h}).join('');
  const tn=TEAMS.filter(n=>TT[n]),H='<th>工數</th><th>金額($)</th><th class="vl">垂流支</th><th>A1</th><th>A2</th><th class="vl">不垂流支</th><th>B1</th><th>B2</th><th class="vl">用量差異</th>';
  return head+`<div class="card wrap"><table><tr><th>日期</th><th>組別</th>${H}<th>樁號</th><th>計價月</th></tr>${rows}
  <tr class="tot"><td>區間合計</td><td></td>${cells(T)}<td class="vl">${dif(T)}</td><td></td><td></td></tr></table>
  <h3>各組合計</h3><table><tr><th>組別</th>${H}</tr>${tn.map(n=>`<tr><td>${n}</td>${cells(TT[n])}<td class="vl">${dif(TT[n])}</td></tr>`).join('')}</table>
  <h3>依計價月份彙總（月底扣廠商用）</h3><table><tr><th>計價月份</th><th>日數</th><th>工數</th><th>金額($)</th></tr>${pmSum(ds).map(r=>`<tr><td>${pmL(r.k)}</td><td>${r.d}</td><td>${r.w}</td><td>${(r.w*S.wage).toLocaleString()}</td></tr>`).join('')}</table></div>
  <p class="mut">金額＝工數×${S.wage.toLocaleString()}。垂流第1次補的支數會標「（待N）」，填入第2次後才計入支數與用量差異；第1次用掉的包數照常扣庫存。點任一列可修改當天記錄。進料請看「進料統計」。</p>`}
async function bulk(){const m=$('#bm').value,ds=sel();
  if(!ds.length){toast('下表沒有日期');return}
  try{for(const d of ds)await put(d,{...D[d],pm:m});toast('已將 '+ds.length+' 天標記為'+(m?pmL(m)+'計價完畢':'未計價'));if(!db)strip();view()}catch(e){toast('標記失敗，請再試一次')}}
async function saveFile(fn,data){let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
  if(dl){await dl.save({filename:fn,data});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
async function exportX(){
  const ds=sel().sort(),L=d=>d+'（'+wd(d)+'）',c=calc(),V=vend(ds),W=w=>num(w)*S.wage;
  const sd=o=>[r2(o.cv*S.std.v),r2(o.cn*S.std.n),r2(o.vu-o.cv*S.std.v),r2(o.B1+o.B2-o.cn*S.std.n)];
  const A=[['日期','工數','金額($)','垂流支數(已完成)','待第2次垂流支數','A1使用','A2使用','不垂流支數','B1使用','B2使用','垂流標準用量','不垂流標準用量','垂流差異','不垂流差異','計價月份','備註']];
  const B=[['日期','組別','工數','金額($)','垂流支數(組模2完成)','組模1新補支數','A1(組模1)','A2(組模1)','組模2 B1','組模2 B2','組模1垂流已用合計','一般不垂流支數','一般 B1','一般 B2','不垂流支數合計','B1合計','B2合計','垂流標準用量','不垂流標準用量','垂流差異','不垂流差異','一般樁號','組模1樁號','組模2樁號']];
  ds.forEach(d=>{const x=D[d],u=U(x);A.push([L(d),u.w,W(u.w),u.cv,u.pc,u.A1,u.A2,u.cn,u.B1,u.B2,...sd(u),D[d].pm||'未計價',x.note||'']);
    Object.entries(G(x)).forEach(([n,o])=>{const a=V(o),m=N(o);B.push([L(d),n,m.w,W(m.w),m.cv,m.pc,m.A1,m.A2,a.m1,a.m2,a.p1,num(o.cn),num(o.B1),num(o.B2),m.cn,m.B1,m.B2,...sd(m),o.gp||'',o.q1||'',o.q2||''])})});
  const C=[['廠商','垂流(包)','不垂流(包)','合計(包)','垂流單價','不垂流單價','金額'],...V.rows,V.tot];
  const I=[['日期',...VEN.flatMap(([,n])=>[n+'垂流',n+'不垂流']),'金額($)','計價月份'],...ds.filter(d=>iq(D[d])>0).sort().map(d=>[L(d),...K.map(k=>num(D[d].in?.[k])),iamt(D[d]),D[d].ipm||'未計價'])];
  const P=[['計價月份','日數','工數','金額($)'],...pmSum(ds).map(r=>[r.k||'未計價',r.d,r.w,r.w*S.wage])];
  const E=[['品項','目前庫存(包)','7天警戒門檻','近7天日均','剩餘可用天數','建議補貨(包)','狀態'],...BR.map(b=>{const r=c[b];return[NM[b],r2(r.stock),r.act?r2(r.thr):'',r.act?r2(r.avg):'',r.left==null?'':r2(r.left),r.act?r.sug:'',ST[r.s]]})];
  const name='水泥進料施工_'+iso(new Date()).replace(/-/g,'');
  try{try{if(!window.XLSX)throw 0;const wb=XLSX.utils.book_new();
      [['每日明細',A],['各組施工明細',B],['計價月份彙總',P],['進料統計',C],['進料明細',I],['目前庫存',E]].forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));
      await saveFile(name+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}));toast('已匯出 Excel');return}
    catch(e){if(e&&e.code==='declined'){toast('已取消匯出');return}}
    const csv='\ufeff'+B.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    await saveFile(name+'_各組明細.csv',csv);toast('Excel 無法產生，已改匯出 CSV')}
  catch(e){toast(e&&e.code==='declined'?'已取消匯出':'匯出失敗，請再試一次')}}
function sett(){const inp=(id,v)=>`<input id="${id}" type="number" step="any" value="${v}">`;
  return `<div class="card"><h3 style="margin-top:0">庫存基準</h3><label class="mut">基準日（收工後）<input id="bd" type="date" value="${S.baseDate}"></label>
  <div class="grid" style="margin-top:8px">${BR.map(b=>`<label>${NM[b]}（包）${inp('b'+b,S.base[b])}</label>`).join('')}</div>
  <h3>廠商單價（元／包）</h3><div class="grid">${VEN.map(([k,n])=>`<label>${n}・垂流${inp('p'+k+'v',S.price[k].v)}</label><label>${n}・不垂流${inp('p'+k+'n',S.price[k].n)}</label>`).join('')}</div>
  <h3>標準用量（包／支）</h3><div class="grid"><label>垂流${inp('sv',S.std.v)}</label><label>不垂流${inp('sn',S.std.n)}</label></div>
  <h3>3D 同步</h3><div class="grid"><label>補樁階段（第幾層）<select id="stg">${[1,2,3,4].map(i=>`<option value="${i}" ${(+S.stage||1)===i?'selected':''}>第${i}層</option>`).join('')}</select></label></div><input type="hidden" id="gas" value="${esc(S.gas||'')}"><div class="mut">雲端連線：使用登入帳號的安全內部連線</div>
  <div class="row" style="margin-top:8px"><button onclick="restoreG()">從雲端硬碟還原資料</button><button onclick="resync3d()">重新同步全部樁號到 3D</button><span class="mut">每次儲存會自動備份到「樁頭修補」資料夾的試算表</span></div>
  <h3>工資（元／工）</h3><div class="grid"><label>1工 ＝${inp('wg',S.wage)}</label></div>
  <div class="row" style="margin-top:14px"><button class="pri" onclick="saveS()">儲存設定</button></div></div>`}
async function saveS(){const g=id=>num($('#'+id).value);
